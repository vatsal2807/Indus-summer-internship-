<!DOCTYPE html>
<html lang0="en">
    <head>
        <script>
             
             function Calc(choice){
            
               
             switch(choice)
            {
               case 1:
                 var a=myfrm.txt1.value
                var b=myfrm.txt2.value
                var c=parseInt(a)+parseInt(b)
                myfrm.ans.value="sum is"+c
                break

                case 2:
                var d=myfrm.txt1.value
                var e=myfrm.txt2.value
                var f=parseInt(d)-parseInt(e)
                myfrm.ans.value="sub is"+f
                break


                case 3 : 
                var g=myfrm.txt1.value
                var h=myfrm.txt2.value
                var i=parseInt(g)*parseInt(h)
                myfrm.ans.value="Mul is"+i
                break

                case 4:
                var j=myfrm.txt1.value
                var k=myfrm.txt2.value
                var l=parseInt(j)/parseInt(k)
                myfrm.ans.value="div is"+l
                break
            }
        }
           
        </script>
        
    </head>
    <body>
        <form id="myfrm">
            No1:<input type="text" name="txt1" /><br/>
            No2:<input type="text" name="txt2" /><br/>
            
            choice :<select name ="txt3">
                <option value = Calc(1)>1</option>
                <option value = Calc(2)>2</option>
                <option>Calc(3)</option>
                <option>Calc(4)</option>
            </select> 
            Sum :<input type="checkbox" onclick="Calc(1)" value="Sum is" />
            Sub:<input type="checkbox" onclick="Calc(2)" value="Sub is" />
            Mul :<input type="radio" onclick="Calc(3)" value="Sum is" />
            Div:<input type="radio" onclick="Calc(4)" value="Sum is" />
              <input type="button" onclick="Calc(choice)" value = "Get Ans"/>
            <input type="text" name="ans" readpnly disabled/>



        </form>
    </body>
</html>
